<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta httpequiv="Permissions-Policy" content="interest-cohort=()" />
    <meta name="description" content="Discava! - Your Vinyl Digging Experience: A platform dedicated to celebrating the timeless allure of vinyl records, soul, funk, and disco music. Join us on this musical journey!">
    <meta name="keywords" content="Discava!, vinyl records, vinyl digging, soul music, funk music, disco music, crate digging, vinyl adventure">
    <meta name="author" content="Juan Falibene">
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Discava! - Your Vinyl Digging Experience">
    <meta property="og:description" content="A platform dedicated to celebrating the timeless allure of vinyl records, soul, funk, and disco music. Join us on this musical journey!">
    <meta property="og:image" content="http://dev.juanfalibene.com/discava/img/discava_shareable_img.jpg">
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:title" content="Discava! - Your Vinyl Digging Experience">
    <meta property="twitter:description" content="A platform dedicated to celebrating the timeless allure of vinyl records, soul, funk, and disco music. Join us on this musical journey!">
    <meta property="twitter:image" content="http://dev.juanfalibene.com/discava/img/discava_shareable_img.jpg">
    <title>Discava! - Your Vinyl Digging Experience</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="icon" type="image/x-icon" href="http://dev.juanfalibene.com/discava/img/favicon.png">
    <script type="text/javascript" src="js/_single_original.js" defer></script>
    <script type="text/javascript" src="js/functions.js" defer></script>
</head>
<body>
    <header class="header" id="header">
        <div class="logo">
            <h1><a href="./index.html">Discava!</a></h1>
        </div>
        <nav class="navbar" id="navbar">
            <ul>
                <li class="nav-item"><a href="./index.html#diggin">Digging</a></li>
                <!--<li class="nav-item"><a href="./index.html#discover">Discover</a></li>-->
                <li class="nav-item"><a href="./about.html">About</a></li>
            </ul>
        </nav>
        <button class="hamburger-button" id="hamburgerButton">
            <span></span>
            <span></span>
            <span></span>
        </button>
    </header>
    <main>
        <section>
            <div class="single-result"></div>
        </section>

        <section class="other-versions-results">
            <h3 class="hide-div">Other Versions</h3>
            <div class="versions-results">
                <ul class="versions-list"></ul>
            </div>
        </section>
        
        <section class="compilations-versions-results">
            <h3 class="hide-div">On Compilations</h3>
            <div class="discos"></div>
        </section>
        
    </main>

    <footer>
        <small>© 2023 Discava! @ SEPE 11-23</small>
        <small>Send me a vinyl from my <a href="https://www.discogs.com/wantlist?user=juanignaciofalibene" target="_blank">Discogs Wantlist</small></a>
    </footer>

    <!-- template: Single Disco Info -->
    <template id="single-disco">
        <div class="single-disco">
            <div class="single-disco-image">
                <div class="single-disco-cover"><img src="" alt="" /></div>
            </div>
            <div class="single-disco-info">
                <h1 class="single-title"></h1>
                <div class="single-info-container">
                    <ul class="single-info"></ul>
                    <ul class="single-notes"></ul>
                </div>
            <div class="single-disco-tracklist">
                <h2 class="single-subtitle">Tracklist</h2>
                <ul class="disco-tracklist"></ul>
            </div>
            <div class="single-action-links">
                <ul class="action-links">
                </ul>
            </div>
    </template>
    <!-- end: template Single Disco Info -->

    <!-- template:  Versions Results -->
    <template id="disco-versions">
            <li class="disco-version">
                <div class="disco-version-thumb"><a href=""><img src="" alt="" /></a></div>
                <div class="disco-version-info"></div>
            </li>
    </template>
    <!-- end: template  Versions Results -->

    <!-- template: Compilations Results -->
    <template id="compilations">
            <div class="disco">
                <a href="">
                    <img src="" alt=""/>
                </a>
                <div class="disco-info">
                    <p class="disco-title"></p>
                    <p class="disco-year"></p>
                    <p class="disco-label"></p>
                </div>
            </div>
    </template>
    <!-- end :template Compilations Results -->
</body>
</html>
